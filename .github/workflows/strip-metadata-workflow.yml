name: Strip metadata from wallpapers

on:
  push:
    branches: [main]

jobs:
  strip-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Strip metadata from all images
        run: node strip-metadata.js .

      - name: Commit cleaned files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Strip metadata from images"
          git push
